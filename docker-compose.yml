services:
  db:
    image: postgres:17
    container_name: chatbot-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_ai
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
